<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Aktivitas Harian</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header Utama -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-200 gap-3">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
          <span>📋</span> Dashboard Aktivitas Harian
        </h1>
        <p class="text-sm text-slate-500">Pencatatan dan pemantauan aktivitas harian secara terstruktur.</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadDailyActivities()" class="bg-white border border-slate-200 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-50 transition shadow-xs flex items-center gap-1.5 cursor-pointer">
          🔄 Segarkan Data
        </button>
      </div>
    </header>

    <!-- Ringkasan Statistik Harian -->
    <section class="bg-slate-900 text-white rounded-2xl p-5 shadow-md border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-blue-600/30 border border-blue-500/30 rounded-xl text-xl">
          📅
        </div>
        <div>
          <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold block">Tanggal Dipilih</span>
          <div class="flex items-center gap-2">
            <input type="date" id="dashboardFilterDate" onchange="loadDailyActivities()" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-sm text-white font-bold outline-none focus:border-blue-500">
            <span id="selectedDateText" class="text-sm font-semibold text-blue-300"></span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-6 w-full md:w-auto justify-around md:justify-end border-t md:border-t-0 border-slate-800 pt-3 md:pt-0">
        <div class="text-center">
          <span class="text-xs text-slate-400 block">Total Kegiatan</span>
          <span id="statTotalActivities" class="text-xl font-bold text-white">0</span>
        </div>
      </div>
    </section>

    <!-- Grid Layout: Form Input & Daftar Aktivitas -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      
      <!-- Formulir Tambah Kegiatan Baru -->
      <section class="lg:col-span-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 sticky top-6">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <span>✍️</span> Tambah Kegiatan
        </h2>

        <form id="activityForm" onsubmit="handleFormSubmit(event)" class="space-y-3.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
            <input type="date" id="inputDate" required class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <!-- Format Jam (24 Jam) -->
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Mulai</label>
              <div class="flex items-center gap-1">
                <select id="startHour" class="w-1/2 border border-slate-200 rounded-lg p-2 text-xs font-medium bg-slate-50 outline-none"></select>
                <span class="font-bold text-slate-400">:</span>
                <select id="startMinute" class="w-1/2 border border-slate-200 rounded-lg p-2 text-xs font-medium bg-slate-50 outline-none"></select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Selesai</label>
              <div class="flex items-center gap-1">
                <select id="endHour" class="w-1/2 border border-slate-200 rounded-lg p-2 text-xs font-medium bg-slate-50 outline-none"></select>
                <span class="font-bold text-slate-400">:</span>
                <select id="endMinute" class="w-1/2 border border-slate-200 rounded-lg p-2 text-xs font-medium bg-slate-50 outline-none"></select>
              </div>
            </div>
          </div>

          <!-- Kategori Sesuai Permintaan -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
            <select id="inputCategory" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
              <option value="🏠 Pekerjaan Rumah">🏠 Pekerjaan Rumah</option>
              <option value="📖 Belajar">📖 Belajar</option>
              <option value="☕ Istirahat">☕ Istirahat</option>
              <option value="📚 Baca Buku">📚 Baca Buku</option>
              <option value="🏃 Olahraga">🏃 Olahraga</option>
              <option value="📖 Al-Quran">📖 Al-Quran</option>
              <option value="📌 13 Pr">📌 13 Pr</option>
              <option value="🤲 Doa-doa">🤲 Doa-doa</option>
              <option value="💼 Bekerja - pendapatan">💼 Bekerja - pendapatan</option>
              <option value="💸 Pengeluaran">💸 Pengeluaran</option>
              <option value="🎓 Progres skripsi">🎓 Progres skripsi</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Kegiatan</label>
            <input type="text" id="inputActivity" required placeholder="Contoh: Menyelesaikan Bab 2 Skripsi" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan</label>
            <textarea id="inputNotes" rows="2" placeholder="Detail tambahan (opsional)" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
          </div>

          <button type="submit" id="btnSubmitActivity" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm cursor-pointer">
            + Simpan Kegiatan
          </button>
          
          <div id="formAlert" class="hidden text-xs text-center p-2 rounded-lg font-medium"></div>
        </form>
      </section>

      <!-- Tampilan Aktivitas Harian -->
      <section class="lg:col-span-8 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <div>
            <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
              <span>📌</span> Kegiatan Yang Sudah Dilakukan
            </h2>
            <p id="dailyDateLabel" class="text-xs text-slate-400 mt-0.5">Memuat data...</p>
          </div>
        </div>

        <!-- Indikator Loading -->
        <div id="dailyLoading" class="text-center py-14 text-sm text-slate-400">
          <div class="animate-spin inline-block w-6 h-6 border-2 border-current border-t-transparent text-blue-600 rounded-full mb-2"></div>
          <p>Memuat aktivitas harian...</p>
        </div>

        <!-- Container Daftar Aktivitas Harian -->
        <div id="dailyContainer" class="space-y-3 hidden"></div>
      </section>

    </div>

  </div>

  <!-- Modal Edit Aktivitas -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border border-slate-100">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 text-base">✏️ Edit Aktivitas</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-lg cursor-pointer">✕</button>
      </div>

      <form id="editForm" onsubmit="handleEditSubmit(event)" class="space-y-3">
        <input type="hidden" id="editId">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
          <input type="date" id="editDate" required class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Mulai</label>
            <div class="flex items-center gap-1">
              <select id="editStartHour" class="w-1/2 border border-slate-200 rounded-lg p-2 text-xs font-medium outline-none"></select>
              <span class="font-bold text-slate-400">:</span>
              <select id="editStartMinute" class="w-1/2 border border-slate-200 rounded-lg p-2 text-xs font-medium outline-none"></select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jam Selesai</label>
            <div class="flex items-center gap-1">
              <select id="editEndHour" class="w-1/2 border border-slate-200 rounded-lg p-2 text-xs font-medium outline-none"></select>
              <span class="font-bold text-slate-400">:</span>
              <select id="editEndMinute" class="w-1/2 border border-slate-200 rounded-lg p-2 text-xs font-medium outline-none"></select>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
          <select id="editCategory" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="🏠 Pekerjaan Rumah">🏠 Pekerjaan Rumah</option>
            <option value="📖 Belajar">📖 Belajar</option>
            <option value="☕ Istirahat">☕ Istirahat</option>
            <option value="📚 Baca Buku">📚 Baca Buku</option>
            <option value="🏃 Olahraga">🏃 Olahraga</option>
            <option value="📖 Al-Quran">📖 Al-Quran</option>
            <option value="📌 13 Pr">📌 13 Pr</option>
            <option value="🤲 Doa-doa">🤲 Doa-doa</option>
            <option value="💼 Bekerja - pendapatan">💼 Bekerja - pendapatan</option>
            <option value="💸 Pengeluaran">💸 Pengeluaran</option>
            <option value="🎓 Progres skripsi">🎓 Progres skripsi</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Kegiatan</label>
          <input type="text" id="editActivity" required class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan</label>
          <textarea id="editNotes" rows="2" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="w-1/2 py-2 text-xs font-semibold text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer">
            Batal
          </button>
          <button type="submit" id="btnSaveEdit" class="w-1/2 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg cursor-pointer">
            Simpan Perubahan
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
